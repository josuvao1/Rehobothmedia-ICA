<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Song Template</title>
    <link rel="stylesheet" type="text/css" href="song4.css">

</head>
<body>
    <div class="shadow">
        <p><b>Pastor P.K. Thiyagaraj</b></p>
    </div>

</body>
	<script>
        // Function to check if .shadow p has only line breaks or is empty
        function checkShadowContent() {
            const pElement = document.querySelector('.shadow p');
            const content = pElement.innerHTML.trim();
            const shadowElement = document.querySelector(".shadow");

            // Check if the content is only line breaks or empty
            if (content === '' || content === '<b><br></b>' || content === '<b></br></b>') {
				// shadowElement.classList.add('empty-content');
				setTimeout(() => {
                    shadowElement.classList.add('empty-content');
                }, 250);
            }
        }

        // Call the function on page load
        document.addEventListener('DOMContentLoaded', checkShadowContent);
    </script>
</html>
